[project]
name = "local-transcription"
version = "0.1.2"
description = "Offline meeting transcription with speaker diarization and voice profile matching"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.15.0",
    "fastapi==0.143.2",
    "huggingface-hub==2.2.0",
    "keyring==25.6.0",
    "mlx-lm==0.32.2",
    "mlx-whisper==0.4.3",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pillow==12.3.0",
    "pyannote-audio==4.0.7",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "scipy==1.17.1",
    "soundfile==0.14.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
bench = [
    "faster-whisper==1.2.1",
]

# installs local_transcription into the environment, linked to this folder, so the scripts in
# scripts/ can import it
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_transcription"]
